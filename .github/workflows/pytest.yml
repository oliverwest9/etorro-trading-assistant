name: pytest

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same PR / branch to save resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  # -----------------------------------------------------------------
  # Unit + integration tests
  # All external calls (eToro API, LLM) are mocked; SurrealDB runs
  # in-memory — no Docker or external services needed.
  #
  # To block PR merges on failure, add a branch-protection rule for
  # the 'main' branch that requires the "tests" status check to pass:
  #   Settings → Rules → Rulesets → New ruleset (or classic branch
  #   protection) → Require status checks → add "tests".
  # -----------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v --tb=short -m "not integration"

      - name: Run integration / E2E tests
        run: pytest -v --tb=short -m integration

      - name: Create issue on test failure
        if: failure()
        uses: actions/github-script@v7
        env:
          COPILOT_ASSIGNEE: ${{ vars.COPILOT_ASSIGNEE || 'copilot' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner,
              repo,
              title: `CI failure: pytest (${context.runId})`,
              body: `Pytest failed in [workflow run](${runUrl}).\n\nCommit: ${context.sha}`,
              assignees: [process.env.COPILOT_ASSIGNEE],
            });
